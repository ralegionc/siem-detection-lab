name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / yaml=${{ matrix.yaml }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
        # The Sigma importer has two code paths: PyYAML when installed, and a
        # bundled minimal parser when it isn't. Both are exercised, because the
        # zero-dependency promise is only real if the fallback actually works.
        yaml: [bundled, pyyaml]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        if: matrix.yaml == 'pyyaml'
        run: python -m pip install --upgrade pip pyyaml

      - name: Confirm dependency state
        run: |
          python -c "
          try:
              import yaml; print('PyYAML present:', yaml.__version__)
          except ImportError:
              print('PyYAML absent -> bundled parser path')
          "

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the CLI
        run: |
          python -m siemlab run
          python -m siemlab generate --out /tmp/events.jsonl --incidents 6
          python -m siemlab detect --events /tmp/events.jsonl > /dev/null
          python -m siemlab evaluate --events /tmp/events.jsonl
          python -m siemlab generate --schema ecs  --out /tmp/events.ecs.jsonl
          python -m siemlab generate --schema ocsf --out /tmp/events.ocsf.jsonl
          python -m siemlab sweep --rates 2,32 --csv /tmp/sweep.csv

      - name: Validate exported schemas are parseable JSON
        run: |
          python -c "
          import json
          for path in ('/tmp/events.ecs.jsonl', '/tmp/events.ocsf.jsonl'):
              n = 0
              for line in open(path):
                  line = line.strip()
                  if line:
                      json.loads(line); n += 1
              print(f'{path}: {n} valid documents')
              assert n > 0, f'{path} is empty'
          "
